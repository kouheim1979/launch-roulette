name: Deploy games to GitHub Pages

# main に push されたら、サイトを組み立てて gh-pages ブランチに置く。
# GitHub Pages は gh-pages ブランチから配信される。
# 公開先: https://kouheim1979.github.io/launch-roulette/atama-oshiri/
#         https://kouheim1979.github.io/launch-roulette/yakitori/

on:
  push:
    branches: [main]
    paths:
      - "atama-oshiri/**"
      - "yakitori/**"
      - ".github/workflows/atama-oshiri-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp -r atama-oshiri _site/atama-oshiri
          cp -r yakitori _site/yakitori
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>launch-roulette</title>
          <style>body{font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px;line-height:2}</style>
          <h1>ゲーム</h1>
          <ul>
          <li><a href="./atama-oshiri/">あたまとおしり</a></li>
          <li><a href="./yakitori/">やきとり ならべ</a></li>
          </ul>
          </html>
          HTML
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
