name: Deploy あたまとおしり to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "atama-oshiri/**"
      - ".github/workflows/atama-oshiri-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site (/launch-roulette/atama-oshiri/)
        run: |
          mkdir -p _site
          cp -r atama-oshiri _site/atama-oshiri
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <meta charset="utf-8">
          <title>launch-roulette</title>
          <meta http-equiv="refresh" content="0; url=./atama-oshiri/">
          <p><a href="./atama-oshiri/">あたまとおしり</a></p>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
