<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="串の具を並べかえて同じ具を4つそろえ、焼いてお客さんの注文に届けるパズルゲーム。">
<meta name="theme-color" content="#F4EBDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1410" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やきとり屋">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>やきとり ならべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root {
  --paper: #F4EBDD;
  --wood: #E2C9A2;
  --wood-2: #CFAF80;
  --card: #FFFBF4;
  --ink: #3A2418;
  --muted: #7D6350;
  --line: #D9C4A6;
  --noren: #B8362A;
  --noren-ink: #FFF6EA;
  --grill: #2B2523;
  --grill-2: #3A322F;
  --ember: #FF7A2E;
  --stick: #E9CF9C;
  --ok: #2E8B57;
  --bad: #C2402F;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1C1410; --wood: #3B2A1E; --wood-2: #4A3526; --card: #2A1E17; --ink: #F5E9DA; --muted: #BFA58C;
    --line: #4C3A2C; --noren: #D2493A; --noren-ink: #FFF6EA; --grill: #121010; --grill-2: #221C1A;
    --stick: #CDB283; --ok: #4CC184; --bad: #F07160; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1C1410; --wood: #3B2A1E; --wood-2: #4A3526; --card: #2A1E17; --ink: #F5E9DA; --muted: #BFA58C;
  --line: #4C3A2C; --noren: #D2493A; --noren-ink: #FFF6EA; --grill: #121010; --grill-2: #221C1A;
  --stick: #CDB283; --ok: #4CC184; --bad: #F07160; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body);
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap {
  max-width: 560px; margin: 0 auto; min-height: 100dvh;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 10px;
}

/* 暖簾ヘッダー */
.noren {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 -4px;
}
.noren span {
  background: var(--noren); color: var(--noren-ink); font-family: var(--display);
  text-align: center; font-size: 1.15rem; padding: 6px 0 10px; border-radius: 0 0 6px 6px;
  letter-spacing: .1em;
}
.hud { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.hud .stat { display: flex; flex-direction: column; line-height: 1.2; }
.hud .stat small { font-size: .7rem; color: var(--muted); font-weight: 700; letter-spacing: .1em; }
.hud .stat b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.hearts { letter-spacing: 2px; font-size: 1.05rem; }
.iconbtn { background: none; border: 2px solid var(--line); border-radius: 10px; width: 38px; height: 38px; font-size: 1.1rem; }

/* カウンター（お客さん） */
.counter {
  background: linear-gradient(var(--wood), var(--wood-2));
  border-radius: 14px; padding: 10px 8px 12px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.12);
}
.seat { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 118px; justify-content: flex-end; position: relative; }
.bubble {
  background: var(--card); border: 2px solid var(--ink); border-radius: 12px;
  padding: 3px 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  position: relative; min-width: 84px;
}
.bubble::after {
  content: ""; position: absolute; bottom: -8px; left: 50%; translate: -50% 0;
  border: 7px solid transparent; border-top-color: var(--ink); border-bottom: 0;
}
.bubble .ord { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: .85rem; white-space: nowrap; }
.bubble svg { width: 30px; height: 20px; }
.pbar { width: 100%; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; width: 100%; background: var(--ok); border-radius: 3px; transform-origin: left; }
.face { font-size: 2.1rem; line-height: 1; margin-top: 6px; }
.seat.arrive .bubble, .seat.arrive .face { animation: arrive .4s cubic-bezier(.3,1.5,.5,1); }
@keyframes arrive { from { opacity: 0; translate: 0 14px; } }
.seat.happy .bubble { border-color: var(--ok); }
.seat .msg { position: absolute; top: 0; left: 50%; translate: -50% 0; font-weight: 900; font-size: .9rem; white-space: nowrap; animation: floatup 1.2s ease-out forwards; pointer-events: none; }
.seat .msg.good { color: var(--ok); }
.seat .msg.bad { color: var(--bad); }
@keyframes floatup { from { opacity: 1; translate: -50% 10px; } to { opacity: 0; translate: -50% -26px; } }
.empty-seat { color: var(--muted); font-size: .75rem; opacity: .7; margin-bottom: 6px; }

/* 焼き場（串） */
.grill {
  flex: 1; background: var(--grill); border-radius: 16px; padding: 14px 6px 10px;
  display: flex; flex-direction: column; justify-content: center; gap: 6px; position: relative;
  background-image: repeating-linear-gradient(90deg, transparent 0 18px, var(--grill-2) 18px 21px);
  box-shadow: inset 0 0 30px rgba(255,90,20,.18);
  min-height: 300px;
}
.tip { color: #EADFCF; text-align: center; font-size: .8rem; opacity: .85; margin: 0 0 4px; text-wrap: balance; }
.board { display: grid; justify-content: center; gap: 14px 4px; }
.skewer {
  --pw: 52px; width: calc(var(--pw) + 6px); position: relative; border: 0; background: none; padding: 0;
  display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start;
  height: calc(var(--ph) * 4 + 50px); padding-bottom: 30px; touch-action: manipulation;
}
.skewer::before {
  content: ""; position: absolute; left: 50%; translate: -50% 0; top: 2px; bottom: 0; width: 4px;
  background: var(--stick); border-radius: 2px 2px 3px 3px;
}
.skewer::after {
  content: ""; position: absolute; left: 50%; translate: -50% 0; bottom: 0; width: 10px; height: 26px;
  background: var(--stick); border-radius: 2px; filter: brightness(.92);
}
.skewer .pc { width: var(--pw); height: var(--ph); position: relative; z-index: 1; transition: translate .15s ease-out; }
.skewer .pc svg { width: 100%; height: 100%; display: block; overflow: visible; }
.skewer.sel .pc.lift { translate: 0 -16px; }
.skewer.sel::before { box-shadow: 0 0 0 2px var(--ember); }
.skewer.target::after { box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
.skewer.shake { animation: shake .3s; }
@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
.skewer .pc.drop { animation: drop .22s ease-out; }
@keyframes drop { from { translate: 0 -18px; } }
.skewer.grilling .pc { animation: char 1.1s forwards; }
@keyframes char { to { filter: brightness(.82) saturate(1.25) sepia(.25); } }
.skewer.grilling .smoke { position: absolute; left: 50%; bottom: 40%; width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); animation: smoke 1.1s ease-out infinite; z-index: 2; }
.skewer.grilling .smoke:nth-child(2) { animation-delay: .35s; margin-left: -12px; }
.skewer.grilling .smoke:nth-child(3) { animation-delay: .7s; margin-left: 10px; }
@keyframes smoke { from { opacity: .8; translate: -50% 0; scale: .6; } to { opacity: 0; translate: -50% -70px; scale: 2.2; } }
.skewer.fly { animation: fly .45s ease-in forwards; }
@keyframes fly { to { translate: 0 -260px; opacity: 0; scale: .7; } }
.flame { position: absolute; left: 50%; bottom: 26px; translate: -50% 0; width: 40px; height: 10px; border-radius: 50%; background: var(--ember); filter: blur(6px); opacity: 0; z-index: 0; }
.skewer.grilling .flame { animation: flame .3s ease-in-out infinite alternate; }
@keyframes flame { from { opacity: .4; } to { opacity: .95; } }

.tray { display: flex; gap: 6px; justify-content: center; min-height: 0; flex-wrap: wrap; }
.tray .dish { background: #fff8; border-radius: 999px; padding: 2px 8px; font-size: .75rem; color: #fff; display: flex; align-items: center; gap: 2px; }
.tray .dish svg { width: 22px; height: 14px; }

.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn {
  border: 2px solid var(--ink); background: var(--card); border-radius: 12px; padding: 9px 4px;
  font-weight: 900; font-size: .9rem; box-shadow: 0 3px 0 var(--ink); line-height: 1.2;
}
.btn:active { translate: 0 2px; box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .4; }
.btn small { display: block; font-weight: 700; font-size: .7rem; color: var(--muted); }
.btn.primary { background: var(--noren); color: var(--noren-ink); border-color: var(--ink); }

/* モーダル */
.modal { position: fixed; inset: 0; background: rgba(20,10,5,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet {
  background: var(--card); border: 3px solid var(--ink); border-radius: 18px; padding: 22px 20px 18px; width: min(380px, 100%);
  text-align: center; box-shadow: 0 8px 0 var(--ink); animation: arrive .35s cubic-bezier(.3,1.5,.5,1);
}
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; margin: 0 0 6px; color: var(--noren); }
.sheet p { margin: 6px 0; }
.sheet .big { font-family: var(--display); font-size: 2rem; }
.sheet .rules { text-align: left; font-size: .9rem; color: var(--muted); padding-left: 1.2em; margin: 10px 0 14px; }
.sheet .rules li { margin: 3px 0; }
.sheet .btn { width: 100%; margin-top: 8px; padding: 12px; font-size: 1rem; }
.menu-pieces { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; margin: 6px 0 2px; }
.menu-pieces div { display: flex; flex-direction: column; align-items: center; font-size: .65rem; color: var(--muted); width: 54px; }
.menu-pieces svg { width: 40px; height: 27px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="noren"><span>やき</span><span>とり</span><span>屋</span></div>
  <div class="hud">
    <div class="stat"><small>LEVEL</small><b id="lv">1</b></div>
    <div class="stat"><small>売上</small><b id="money">¥0</b></div>
    <div class="stat"><small>おきゃくさん</small><span class="hearts" id="hearts">❤❤❤</span></div>
    <button class="iconbtn" id="mute" aria-label="音のオンオフ">🔊</button>
  </div>
  <div class="counter" id="counter"></div>
  <div class="grill">
    <p class="tip" id="tip"></p>
    <div class="board" id="board"></div>
    <div class="tray" id="tray"></div>
  </div>
  <div class="controls">
    <button class="btn" id="undo">↩︎ もどす</button>
    <button class="btn" id="extra">＋ 串<small id="extraLeft">のこり1</small></button>
    <button class="btn" id="retry">↻ やりなおし</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";
const CAP = 4;
const SEATS = 3;

// 具の種類（絵はSVGで描く）
const KINDS = {
  momo:     { name: "もも",     price: 180, svg: `<rect x="6" y="4" width="48" height="32" rx="12" fill="#E2A868"/><path d="M14 13h32M12 21h36M14 29h32" stroke="#9B5A26" stroke-width="3" stroke-linecap="round" opacity=".7"/><rect x="10" y="7" width="20" height="6" rx="3" fill="#fff" opacity=".35"/>` },
  negi:     { name: "ねぎま",   price: 200, svg: `<rect x="8" y="6" width="44" height="28" rx="6" fill="#F3EED2"/><rect x="8" y="6" width="9" height="28" rx="4" fill="#8FBF4D"/><rect x="43" y="6" width="9" height="28" rx="4" fill="#8FBF4D"/><path d="M20 13h20M20 27h20" stroke="#C9C29A" stroke-width="2.5" stroke-linecap="round"/>` },
  tsukune:  { name: "つくね",   price: 220, svg: `<ellipse cx="30" cy="20" rx="25" ry="16" fill="#7A4628"/><ellipse cx="22" cy="13" rx="10" ry="4" fill="#fff" opacity=".28"/><circle cx="36" cy="24" r="1.6" fill="#3E2213"/><circle cx="24" cy="25" r="1.4" fill="#3E2213"/><circle cx="40" cy="15" r="1.3" fill="#3E2213"/>` },
  reba:     { name: "レバー",   price: 190, svg: `<path d="M8 22c0-12 12-17 22-15 13 2 23 6 22 15-1 10-12 13-24 12C16 33 8 30 8 22z" fill="#6E2330"/><path d="M16 14c6-4 14-4 18-2" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".25" fill="none"/>` },
  hatsu:    { name: "ハツ",     price: 190, svg: `<path d="M30 36C14 28 6 20 8 12c2-7 12-9 16-3 2 2 4 3 6 3s4-1 6-3c4-6 14-4 16 3 2 8-6 16-22 24z" fill="#C2483E"/><path d="M15 12c2-3 6-3 8-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".35" fill="none"/>` },
  shiitake: { name: "しいたけ", price: 160, svg: `<rect x="24" y="22" width="12" height="14" rx="4" fill="#EBDDC2"/><path d="M5 24C5 10 17 4 30 4s25 6 25 20c0 3-2 4-5 4H10c-3 0-5-1-5-4z" fill="#8A5634"/><path d="M22 10l16 10M38 10L22 20" stroke="#F3E6CC" stroke-width="3" stroke-linecap="round"/>` },
  shishito: { name: "ししとう", price: 150, svg: `<path d="M6 22c4-10 18-14 32-12 8 1 13 4 15 8 1 3-1 6-5 7-14 4-30 6-40 3-2-1-3-3-2-6z" fill="#4E8B2C"/><path d="M50 17c3-4 6-5 8-4" stroke="#6F5A2C" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M14 18c8-4 18-5 26-3" stroke="#B8E08A" stroke-width="2.5" stroke-linecap="round" opacity=".6" fill="none"/>` },
  uzura:    { name: "うずら",   price: 170, svg: `<ellipse cx="30" cy="20" rx="20" ry="16" fill="#F6E7C4"/><ellipse cx="30" cy="20" rx="20" ry="16" fill="none" stroke="#D8B97A" stroke-width="2"/><ellipse cx="23" cy="13" rx="7" ry="4" fill="#fff" opacity=".7"/>` },
};
const KIND_ORDER = ["momo", "negi", "tsukune", "shiitake", "reba", "uzura", "hatsu", "shishito"];
const FACES = ["👨", "👩", "👴", "👵", "🧑", "👨‍🦰", "👩‍🦱", "🧔", "👱‍♀️", "👨‍🦳", "🧑‍🦱", "👩‍🦳"];
const pieceSVG = k => `<svg viewBox="0 0 60 40" aria-hidden="true">${KINDS[k].svg}</svg>`;

// ---- 保存 ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("yakitori:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("yakitori:" + k, JSON.stringify(v)); } catch {} },
};

// ---- 音 ----
let actx = null, muted = store.get("muted", false);
function tone(freq, dur = .08, type = "triangle", vol = .12, when = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
function sizzle() {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * 1, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .3 ? 1 : .3) * (1 - i / len);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = "highpass"; f.frequency.value = 2500; g.gain.value = .07;
    src.connect(f).connect(g).connect(actx.destination); src.start();
  } catch {}
}
const sfx = {
  pick: () => tone(520, .06),
  drop: () => tone(330, .08),
  no: () => tone(140, .12, "square", .06),
  coin: () => { tone(988, .09, "square", .06); tone(1319, .18, "square", .06, .08); },
  angry: () => { tone(220, .15, "sawtooth", .06); tone(180, .2, "sawtooth", .06, .12); },
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

// ---- 状態 ----
let S; // ゲーム全体
let L; // レベル内
let uid = 0;
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];

function levelSpec(n) {
  const kinds = Math.min(3 + Math.floor((n - 1) / 2), 8);       // 3,3,4,4,5,5,...8
  const dup = n >= 9 ? Math.min(1 + Math.floor((n - 9) / 3), 3) : 0; // 同じ具を2本ぶん注文される
  const patience = Math.max(26, 62 - n * 3);                     // 秒
  return { kinds, dup, patience, empty: 2 };
}

function makePuzzle(kindList) {
  // 同じ具が最初からそろってる串がないように混ぜる
  for (let tries = 0; tries < 200; tries++) {
    const bag = shuffle(kindList.flatMap(k => Array(CAP).fill(k)));
    const sks = [];
    for (let i = 0; i < kindList.length; i++) sks.push(bag.slice(i * CAP, i * CAP + CAP));
    if (sks.every(s => new Set(s).size > 1)) return sks;
  }
  return null;
}

function startGame() {
  S = { level: 1, money: 0, misses: 0 };
  startLevel();
}

function startLevel(retry = false) {
  const spec = levelSpec(S.level);
  const prev = L;
  if (retry && prev) {
    L = { spec, list: prev.list, puzzle: prev.puzzle, retryMoney: prev.retryMoney };
    S.money = prev.retryMoney;
  } else {
    const kinds = shuffle(KIND_ORDER.slice()).slice(0, spec.kinds);
    const list = kinds.concat(shuffle(kinds.slice()).slice(0, spec.dup));
    L = { spec, list, puzzle: makePuzzle(list), retryMoney: S.money };
  }
  L.gen = ++uid;
  const puzzle = L.puzzle;
  Object.assign(L, {
    skewers: puzzle.map(items => ({ id: ++uid, items: items.slice(), busy: false }))
      .concat(Array.from({ length: spec.empty }, () => ({ id: ++uid, items: [], busy: false }))),
    sel: null, hist: [], extraLeft: 1,
    pool: L.list.slice(), // まだ誰も注文していない分
    tray: [],             // 焼けたけど注文待ち
    seats: Array(SEATS).fill(null),
    nextArrive: [0.3, 2.2, 4.5], earned: 0, done: false,
  });
  $("board").innerHTML = ""; skEls.clear();
  $("tip").textContent = S.level === 1
    ? "串をタップ → 別の串をタップで具をうつす。同じ具を4つそろえると焼けて、お客さんに届くよ！"
    : `LEVEL ${S.level}：${spec.kinds}種類${spec.dup ? `＋同じ具の注文${spec.dup}本` : ""}`;
  render(); renderSeats(true);
}

// ---- 串のルール ----
function topRun(items) {
  if (!items.length) return 0;
  const t = items[items.length - 1]; let n = 0;
  for (let i = items.length - 1; i >= 0 && items[i] === t; i--) n++;
  return n;
}
function canMove(a, b) {
  const A = L.skewers[a], B = L.skewers[b];
  if (a === b || A.busy || B.busy || !A.items.length || B.items.length >= CAP) return false;
  return !B.items.length || B.items[B.items.length - 1] === A.items[A.items.length - 1];
}
function tapSkewer(i) {
  if (L.done) return;
  const sk = L.skewers[i];
  if (sk.busy) return;
  if (L.sel === null) {
    if (!sk.items.length) return;
    L.sel = i; sfx.pick(); render(); return;
  }
  if (L.sel === i) { L.sel = null; render(); return; }
  const from = L.sel;
  if (!canMove(from, i)) {
    if (sk.items.length && !sk.busy) { L.sel = i; sfx.pick(); render(); return; } // 選びなおし
    L.sel = null; sfx.no(); shake(i); render(); return;
  }
  const A = L.skewers[from], B = sk;
  const n = Math.min(topRun(A.items), CAP - B.items.length);
  L.hist.push({ from, to: i, n });
  for (let k = 0; k < n; k++) B.items.push(A.items.pop());
  L.sel = null; sfx.drop();
  dropN.set(B.id, n);
  if (B.items.length === CAP && new Set(B.items).size === 1) completeSkewer(B);
  render();
}
function undo() {
  const m = L.hist.pop();
  if (!m) return;
  const A = L.skewers[m.from], B = L.skewers[m.to];
  if (A.busy || B.busy) { L.hist = []; return; }
  for (let k = 0; k < m.n; k++) A.items.push(B.items.pop());
  L.sel = null; sfx.drop(); render();
}
function addExtra() {
  if (L.extraLeft <= 0 || L.done) return;
  L.extraLeft--; L.skewers.push({ id: ++uid, items: [], busy: false }); sfx.pick(); render();
}

function completeSkewer(sk) {
  sk.busy = true; L.hist = []; sizzle(); buzz(30);
  const kind = sk.items[0], g = L.gen;
  setTimeout(() => {
    if (L.gen !== g) return;
    const el = skEls.get(sk.id); if (el) el.classList.add("fly");
    setTimeout(() => {
      if (L.gen !== g) return;
      sk.items = []; sk.busy = false;
      const el2 = skEls.get(sk.id); if (el2) el2.classList.remove("fly", "grilling");
      deliver(kind); render();
    }, 450);
  }, 1150);
}

// ---- お客さん ----
function deliver(kind) {
  // 注文している中で一番待ってる人へ
  let best = -1;
  L.seats.forEach((c, i) => { if (c && !c.leaving && c.kind === kind && (best < 0 || c.left < L.seats[best].left)) best = i; });
  if (best >= 0) serve(best); else { L.tray.push(kind); }
}
function serve(i) {
  const c = L.seats[i];
  const price = KINDS[c.kind].price;
  const tip = Math.round(price * 0.6 * (c.left / c.max) / 10) * 10;
  S.money += price + tip; L.earned += price + tip;
  sfx.coin(); buzz(20);
  c.leaving = "happy"; c.msg = tip > 0 ? `+¥${price}  チップ¥${tip}` : `+¥${price}`;
  renderSeats(); renderHud();
  const g = L.gen;
  setTimeout(() => { if (L.gen !== g) return; L.seats[i] = null; L.nextArrive[i] = 0.8 + Math.random() * 1.2; renderSeats(); checkClear(); }, 1100);
}
function arrive(i) {
  if (!L.pool.length) return;
  // 焼き上がり待ちの皿があればそれを注文する人を優先
  let kind;
  const trayKind = L.tray.find(k => L.pool.includes(k));
  if (trayKind && Math.random() < .7) kind = trayKind;
  else kind = pick(L.pool);
  L.pool.splice(L.pool.indexOf(kind), 1);
  const max = L.spec.patience * (0.85 + Math.random() * 0.3);
  L.seats[i] = { kind, max, left: max, face: pick(FACES), fresh: true };
  renderSeats();
  const t = L.tray.indexOf(kind);
  if (t >= 0) { L.tray.splice(t, 1); renderTray(); const g = L.gen; setTimeout(() => L.gen === g && L.seats[i] && !L.seats[i].leaving && serve(i), 500); }
}
function timeout(i) {
  const c = L.seats[i];
  c.leaving = "angry"; c.msg = "おそい！"; L.pool.push(c.kind);
  S.misses++; sfx.angry(); buzz([60, 40, 60]);
  renderSeats(); renderHud();
  const g = L.gen;
  setTimeout(() => {
    if (L.gen !== g) return;
    L.seats[i] = null; L.nextArrive[i] = 1.5 + Math.random();
    renderSeats();
    if (S.misses >= 3) gameOver();
  }, 1100);
}
function checkClear() {
  if (L.done) return;
  const remaining = L.skewers.some(s => s.items.length);
  if (!remaining && !L.pool.length && !L.tray.length && L.seats.every(s => !s)) {
    L.done = true;
    const best = store.get("best", { level: 0, money: 0 });
    if (S.level > best.level || S.money > best.money) store.set("best", { level: Math.max(best.level, S.level), money: Math.max(best.money, S.money) });
    setTimeout(() => showModal("clear"), 300);
  }
}
function gameOver() {
  if (L.done) return;
  L.done = true;
  const best = store.get("best", { level: 0, money: 0 });
  store.set("best", { level: Math.max(best.level, S.level - 1), money: Math.max(best.money, S.money) });
  showModal("over");
}

// ---- 描画 ----
const skEls = new Map();
const dropN = new Map();
function render() {
  const board = $("board"), n = L.skewers.length;
  const cols = n <= 7 ? n : Math.ceil(n / 2);
  const avail = Math.min(board.parentElement.clientWidth || 340, 548) - 12;
  const pw = Math.max(34, Math.min(58, Math.floor(avail / cols) - 10));
  board.style.gridTemplateColumns = `repeat(${cols}, auto)`;
  board.style.setProperty("--ph", Math.round(pw * 0.66) + "px");
  L.skewers.forEach((sk, i) => {
    let el = skEls.get(sk.id);
    if (!el) {
      el = document.createElement("button");
      el.className = "skewer"; el.type = "button";
      el.addEventListener("click", () => tapSkewer(L.skewers.findIndex(s => s.id === sk.id)));
      skEls.set(sk.id, el); board.appendChild(el);
    }
    el.style.setProperty("--pw", pw + "px");
    const sig = sk.items.join(",") + "|" + sk.busy;
    if (el.dataset.sig !== sig) {
      const nd = dropN.get(sk.id) || 0; dropN.delete(sk.id);
      el.innerHTML = `<span class="flame"></span>` + sk.items.map((k, j) =>
        `<div class="pc${j >= sk.items.length - nd ? " drop" : ""}" data-k="${k}">${pieceSVG(k)}</div>`).join("")
        + (sk.busy ? `<span class="smoke"></span><span class="smoke"></span><span class="smoke"></span>` : "");
      el.dataset.sig = sig;
      el.setAttribute("aria-label", sk.items.length ? sk.items.map(k => KINDS[k].name).join("、") : "からの串");
    }
    if (sk.busy) el.classList.add("grilling");
    const isSel = L.sel === i;
    el.classList.toggle("sel", isSel);
    el.classList.toggle("target", L.sel !== null && canMove(L.sel, i));
    const run = isSel ? topRun(sk.items) : 0;
    el.querySelectorAll(".pc").forEach((p, j) => p.classList.toggle("lift", j >= sk.items.length - run));
  });
  $("undo").disabled = !L.hist.length;
  $("extra").disabled = L.extraLeft <= 0;
  $("extraLeft").textContent = `のこり${L.extraLeft}`;
  renderHud(); renderTray();
}
function shake(i) {
  const el = skEls.get(L.skewers[i].id); if (!el) return;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
}
function renderHud() {
  $("lv").textContent = S.level;
  $("money").textContent = "¥" + S.money.toLocaleString();
  $("hearts").textContent = "❤".repeat(Math.max(0, 3 - S.misses)) + "♡".repeat(Math.min(3, S.misses));
}
function renderTray() {
  $("tray").innerHTML = L.tray.map(k => `<span class="dish">${pieceSVG(k)} ${KINDS[k].name} 待ち</span>`).join("");
}
const seatEls = [];
function renderSeats(init) {
  const counter = $("counter");
  if (init || !seatEls.length) {
    counter.innerHTML = ""; seatEls.length = 0;
    for (let i = 0; i < SEATS; i++) { const d = document.createElement("div"); d.className = "seat"; counter.appendChild(d); seatEls.push(d); }
  }
  L.seats.forEach((c, i) => {
    const d = seatEls[i];
    const sig = c ? `${c.face}${c.kind}${c.leaving || ""}` : "empty";
    if (d.dataset.sig === sig) return;
    d.dataset.sig = sig;
    d.className = "seat" + (c && c.fresh ? " arrive" : "") + (c && c.leaving === "happy" ? " happy" : "");
    if (c) c.fresh = false;
    if (!c) { d.innerHTML = `<div class="empty-seat">空席</div><div class="face" style="opacity:.25">🪑</div>`; return; }
    const face = c.leaving === "happy" ? "😋" : c.leaving === "angry" ? "😠" : c.face;
    d.innerHTML = `<div class="bubble"><div class="ord">${pieceSVG(c.kind)}${KINDS[c.kind].name}</div><div class="pbar"><i></i></div></div>
      <div class="face">${face}</div>${c.msg ? `<div class="msg ${c.leaving === "happy" ? "good" : "bad"}">${c.msg}</div>` : ""}`;
    c.bar = d.querySelector(".pbar i");
    updateBar(c);
  });
}
function updateBar(c) {
  if (!c.bar) return;
  const r = Math.max(0, c.left / c.max);
  c.bar.style.transform = `scaleX(${r})`;
  c.bar.style.background = r > .5 ? "var(--ok)" : r > .25 ? "#E0A020" : "var(--bad)";
}

// ---- ループ ----
let last = performance.now(), paused = true;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (!paused && L && !L.done) {
    L.seats.forEach((c, i) => {
      if (!c) {
        L.nextArrive[i] -= dt;
        if (L.nextArrive[i] <= 0 && L.pool.length) arrive(i);
        return;
      }
      if (c.leaving) return;
      c.left -= dt; updateBar(c);
      if (c.left <= 0) timeout(i);
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange", () => { if (document.hidden && L && !L.done && $("modal").hidden) showModal("pause"); });

// ---- モーダル ----
function showModal(type) {
  paused = true;
  const sheet = $("sheet");
  const best = store.get("best", { level: 0, money: 0 });
  const menu = `<div class="menu-pieces">${KIND_ORDER.map(k => `<div>${pieceSVG(k)}${KINDS[k].name}</div>`).join("")}</div>`;
  if (type === "title") {
    sheet.innerHTML = `<h2>やきとり ならべ</h2>
      <p>串の具をならべかえて、注文の串を焼こう！</p>${menu}
      <ul class="rules">
        <li>串をタップ → 別の串をタップで、いちばん上の具をうつせる</li>
        <li>うつせるのは「からの串」か「同じ具がいちばん上の串」だけ</li>
        <li>同じ具を4つそろえると焼けて、注文したお客さんに届く</li>
        <li>早く届けるほどチップが多い。3人おこらせると閉店…</li>
      </ul>
      ${best.level ? `<p style="font-size:.85rem;color:var(--muted)">さいこう記録：LEVEL ${best.level} ／ ¥${best.money.toLocaleString()}</p>` : ""}
      <button class="btn primary" id="go">開店する</button>`;
    $("go").onclick = () => { hideModal(); startGame(); };
  } else if (type === "clear") {
    sheet.innerHTML = `<h2>まいど！</h2><p>LEVEL ${S.level} クリア</p>
      <p class="big">+¥${L.earned.toLocaleString()}</p><p style="color:var(--muted)">売上 ¥${S.money.toLocaleString()}</p>
      <button class="btn primary" id="go">つぎのお客さんへ</button>`;
    $("go").onclick = () => { hideModal(); S.level++; startLevel(); };
  } else if (type === "over") {
    sheet.innerHTML = `<h2>本日閉店…</h2><p>お客さんを3人おこらせちゃった</p>
      <p class="big">LEVEL ${S.level}</p><p>売上 ¥${S.money.toLocaleString()}</p>
      <button class="btn primary" id="go">このレベルからやりなおす</button>
      <button class="btn" id="title">さいしょから</button>`;
    $("go").onclick = () => { hideModal(); S.misses = 0; startLevel(true); };
    $("title").onclick = () => showModal("title");
  } else if (type === "pause") {
    sheet.innerHTML = `<h2>ひと休み</h2><p>お客さんは待っててくれてるよ</p><button class="btn primary" id="go">再開</button>`;
    $("go").onclick = hideModal;
  } else if (type === "retry") {
    sheet.innerHTML = `<h2>やりなおす？</h2><p>このレベルを最初の並びからやりなおすよ（売上もレベル開始時にもどる）</p>
      <button class="btn primary" id="go">やりなおす</button><button class="btn" id="no">つづける</button>`;
    $("go").onclick = () => { hideModal(); startLevel(true); };
    $("no").onclick = hideModal;
  }
  $("modal").hidden = false;
}
function hideModal() { $("modal").hidden = true; paused = false; last = performance.now(); }

$("undo").onclick = undo;
$("extra").onclick = addExtra;
$("retry").onclick = () => L && !L.done && showModal("retry");
$("mute").textContent = muted ? "🔇" : "🔊";
$("mute").onclick = () => { muted = !muted; store.set("muted", muted); $("mute").textContent = muted ? "🔇" : "🔊"; };
window.addEventListener("resize", () => L && render());

showModal("title");

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
